<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/assets/coronamain.png">
  <title>Acceso Admin | miFiestAPP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 80px);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-logo {
      height: 70px;
      margin-bottom: 20px;
    }
    .login-title {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      letter-spacing: 2px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .login-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .form-group {
      margin-bottom: 25px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gold-primary);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .form-control {
      width: 100%;
      padding: 14px 20px;
      border-radius: 25px;
      border: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
      text-align: center;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
    }
    .form-control:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.2), inset 0 2px 5px rgba(0, 0, 0, 0.5);
    }
    .login-error {
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 15px;
      min-height: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .login-error.visible {
      opacity: 1;
    }
    #toggle-password:hover {
      opacity: 1 !important;
      filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.4));
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="panel login-card">
      <img src="/assets/completomain.png" alt="miFiestAPP" style="height: 120px; width: auto; margin: 0 auto 25px auto; display: block; filter: drop-shadow(0 4px 15px rgba(212,175,55,0.15));">
      <h1 class="login-title" style="display: none;">Administración</h1>
      <div class="login-subtitle">Acceso al Panel de Control</div>
      
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email del Cliente</label>
          <input type="email" id="email" class="form-control" placeholder="cliente@ejemplo.com" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Contraseña de Acceso</label>
          <div class="password-wrapper" style="position: relative; width: 100%;">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 50px;">
            <button type="button" id="toggle-password" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--gold-primary); display: flex; align-items: center; justify-content: center; outline: none; padding: 5px; opacity: 0.7; transition: opacity 0.2s;">
              <svg id="eye-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
            </button>
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
        <div id="error-message" class="login-error">Email o contraseña incorrectos</div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Add password toggle functionality
      const toggleBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');

      const eyeOpenPath = 'M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z';
      const eyeClosedPath = 'M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.82l2.92 2.92c1.51-1.39 2.7-3.18 3.44-5.24-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15c.01-.06.01-.12.01-.17 0-1.66-1.34-3-3-3-.05 0-.11 0-.17.01z';

      if (toggleBtn && passwordInput && eyeIcon) {
        toggleBtn.addEventListener('click', () => {
          if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.innerHTML = `<path d="${eyeClosedPath}"/>`;
          } else {
            passwordInput.type = 'password';
            eyeIcon.innerHTML = `<path d="${eyeOpenPath}"/>`;
          }
        });
      }

      const urlParams = new URLSearchParams(window.location.search);
      const eventId = urlParams.get('event') || 'default';
      
      if (eventId !== 'default') {
        try {
          const response = await fetch(`/api/config?event=${encodeURIComponent(eventId)}`);
          if (response.ok) {
            const data = await response.json();
            if (data.clientName) {
              document.querySelector('.login-title').textContent = data.clientName;
              document.querySelector('.login-subtitle').textContent = 'Panel de Control • miFiestAPP';
              document.title = `Acceso Admin | ${data.clientName}`;
            }
          }
        } catch (err) {
          console.error('Error fetching event config:', err);
        }
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-message');
      const submitBtn = document.querySelector('#login-form button[type="submit"]');
      
      errorMsg.classList.remove('visible');
      
      // Save original button content and lock button with loading spinner
      const originalBtnHtml = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.8';
      submitBtn.style.cursor = 'wait';
      submitBtn.innerHTML = '<span class="spinner-loader"></span> Ingresando...';

      const resetBtn = () => {
        submitBtn.disabled = false;
        submitBtn.style.opacity = '';
        submitBtn.style.cursor = '';
        submitBtn.innerHTML = originalBtnHtml;
      };
      
      const urlParams = new URLSearchParams(window.location.search);
      const eventId = urlParams.get('event') || 'default';
      
      try {
        const response = await fetch(`/api/admin/login?event=${encodeURIComponent(eventId)}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password, eventId })
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          if (data.isVendor || data.redirectUrl) {
            window.location.href = data.redirectUrl || '/vendedor';
            return;
          }
          // Redirect to event home page
          const service = urlParams.get('service');
          const targetEventId = data.eventId || eventId;
          const redirectUrl = `/event.html?event=${encodeURIComponent(targetEventId)}${service ? `&service=${encodeURIComponent(service)}` : ''}`;
          window.location.href = redirectUrl;
        } else {
          resetBtn();
          errorMsg.textContent = data.error || 'Error al iniciar sesión';
          errorMsg.classList.add('visible');
        }
      } catch (err) {
        resetBtn();
        errorMsg.textContent = 'Error de conexión con el servidor';
        errorMsg.classList.add('visible');
      }
    });
  </script>
</body>
</html>
