<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/assets/coronamain.png">
  <title>Página No Encontrada | miFiestAPP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0b0c;
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #f3e09d 0%, #d4af37 50%, #aa7c11 100%);
      --text-main: #f5f5f7;
      --text-muted: #a0a0a5;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }
    
    .container {
      max-width: 400px;
      padding: 40px 20px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 5rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    
    h2 {
      font-family: 'Cinzel', serif;
      font-weight: 400;
      font-size: 1.5rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    
    .btn {
      display: inline-block;
      padding: 12px 30px;
      border: 1px solid var(--gold-primary);
      border-radius: 25px;
      color: var(--bg-color);
      background: var(--gold-gradient);
      text-decoration: none;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
      <img src="/assets/coronamain.png" alt="miFiestAPP" style="height: 50px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(212,175,55,0.4));">
    </div>
    <h1>404</h1>
    <h2>No Encontrado</h2>
    <p>La página que estás buscando no existe o ha sido movida.</p>
    <a href="/" class="btn">Volver al Inicio</a>
  </div>
</body>
</html>
