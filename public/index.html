<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Localizador de Mesas | Jano's Eventos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  
  <header>
    <div class="logo-container">
      <img src="/assets/LOGO_JANOS.png" alt="Logo Jano's Eventos">
    </div>
    <div class="subtitle" id="event-subtitle">Salón de Eventos</div>
  </header>

  <main>
    <!-- Search Section Card -->
    <div class="card" id="search-card">
      <h2>Encuentra tu Mesa</h2>
      <p class="instructions">Ingresa tu nombre y apellido a continuación para ubicar tu mesa asignada en el evento.</p>
      
      <form id="search-form" onsubmit="event.preventDefault();">
        <div class="search-box-container">
          <label for="guest-name-input">Nombre del Invitado</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="guest-name-input" 
              placeholder="Ej. Juan Pérez" 
              autocomplete="off"
              required
            >
          </div>
          <!-- Auto-complete Suggestions Dropdown -->
          <ul class="suggestions-list" id="suggestions-box"></ul>
        </div>
        
        <button type="submit" class="btn-search" id="btn-submit-search">Buscar</button>
      </form>
    </div>

    <!-- VIP Ticket Reveal Container (Hidden initially) -->
    <div class="ticket-wrapper" id="ticket-wrapper">
      <div class="ticket">
        <div class="ticket-header">
          <div class="ticket-vip-tag">Invitado VIP</div>
          <div class="ticket-name" id="result-name">Juan Pérez</div>
        </div>
        <div class="ticket-body">
          <div class="ticket-label">Tu mesa asignada es</div>
          <div class="ticket-table-number" id="result-table">Mesa 12</div>
        </div>
        <div class="ticket-footer">
          <button class="btn-back" id="btn-search-again">Buscar Otro</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 <a href="https://www.janoseventos.com" target="_blank">Jano's Eventos</a>. Todos los derechos reservados.
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
