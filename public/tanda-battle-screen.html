<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla Gigante | La Batalla del Playlist - miFiestAPP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa820a 100%);
      --bg-dark: #0a0a0d;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 10% 90%, rgba(212, 175, 55, 0.08) 0%, transparent 40%);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Ambient Glow Bar */
    .header-bar {
      padding: 24px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(14, 14, 18, 0.8);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      backdrop-filter: blur(16px);
    }
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 800;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .timer-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(212, 175, 55, 0.1);
      border: 1.5px solid rgba(212, 175, 55, 0.4);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--gold-primary);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
    }

    /* Main Screen Grid */
    .screen-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 40px;
      padding: 30px 40px;
      height: calc(100vh - 100px);
    }

    /* Left Sidebar: QR Code & Call to Action */
    .qr-sidebar {
      background: rgba(22, 22, 28, 0.85);
      border: 1.5px solid rgba(212, 175, 55, 0.3);
      border-radius: 30px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      position: relative;
    }
    .qr-box {
      background: #ffffff;
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
      margin-bottom: 24px;
    }
    .qr-img {
      width: 200px;
      height: 200px;
      display: block;
    }
    .qr-instructions {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: var(--gold-primary);
      line-height: 1.4;
      font-weight: 700;
    }
    .qr-subtext {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 10px;
    }

    /* Right Main Leaderboard */
    .leaderboard-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
    }
    .rank-card {
      background: rgba(22, 22, 28, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
      overflow: hidden;
      transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
    }
    .rank-card.top-1 {
      border-color: rgba(212, 175, 55, 0.8);
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(22, 22, 28, 0.9) 100%);
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.25);
      transform: scale(1.02);
    }
    .rank-fill-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0.35) 100%);
      z-index: 1;
      transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .rank-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
    }
    .rank-badge {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--gold-primary);
      width: 45px;
      text-align: center;
    }
    .track-cover {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      border: 1.5px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .track-details {
      flex: 1;
    }
    .title-text {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .artist-text {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.65);
    }
    .percentage-text {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--gold-primary);
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
      min-width: 110px;
      text-align: right;
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <div class="brand-title">
      <img src="/assets/coronamain.png" alt="Corona" style="height: 36px;">
      <span id="header-title-text">LA BATALLA DEL PLAYLIST</span>
    </div>
    <div class="timer-badge">
      <span>⏱️ TIEMPO DE VOTACIÓN:</span>
      <span id="timer-display">15:00</span>
    </div>
  </header>

  <div class="screen-layout">
    <!-- QR Sidebar -->
    <div class="qr-sidebar">
      <div class="qr-box">
        <img id="qr-image" class="qr-img" src="" alt="QR Pedí tu Canción">
      </div>
      <div class="qr-instructions">¡Elegí los temas de la próxima tanda!</div>
      <div class="qr-subtext">Escaneá con tu celular para votar y proponer tus canciones favoritas.</div>
    </div>

    <!-- Live Leaderboard -->
    <div id="leaderboard-container" class="leaderboard-container">
      <div style="text-align: center; color: rgba(255,255,255,0.4); font-size: 1.3rem;">Cargando ranking en tiempo real...</div>
    </div>
  </div>

  <script src="/js/qr-smart-router.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('event') || 'default';

    // Set Smart QR image (resolves LAN IP in local dev for seamless iPhone testing)
    async function initSmartQR() {
      const qrUrl = await window.generateSmartQRUrl(`/pedir-cancion.html?event=${encodeURIComponent(eventId)}`, { size: '250x250' });
      document.getElementById('qr-image').src = qrUrl;
    }
    initSmartQR();

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function renderLeaderboard(list) {
      const container = document.getElementById('leaderboard-container');
      if (!list || list.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; color: rgba(255,255,255,0.5); font-size: 1.4rem; padding: 40px; border: 1px dashed rgba(212,175,55,0.3); border-radius: 24px;">
            🎵 ¡Escaneá el QR para postular las primeras canciones de la tanda!
          </div>
        `;
        return;
      }

      const topItems = list.slice(0, 5);

      container.innerHTML = topItems.map((item, index) => `
        <div class="rank-card ${index === 0 ? 'top-1' : ''}">
          <div class="rank-fill-bar" style="width: ${item.approvalPercentage}%"></div>
          <div class="rank-content">
            <div class="rank-badge">#${index + 1}</div>
            <img src="${item.albumCover}" class="track-cover" alt="Cover">
            <div class="track-details">
              <div class="title-text">${item.title}</div>
              <div class="artist-text">${item.artist}</div>
            </div>
            <div class="percentage-text">${item.approvalPercentage}%</div>
          </div>
        </div>
      `).join('');
    }

    function renderGenresLeaderboard(genresList) {
      const container = document.getElementById('leaderboard-container');
      if (!genresList || genresList.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; color: rgba(255,255,255,0.5); font-size: 1.4rem; padding: 40px; border: 1px dashed rgba(212,175,55,0.3); border-radius: 24px;">
            🎭 Escaneá el QR para votar los géneros de la próxima tanda.
          </div>
        `;
        return;
      }

      const topGenres = genresList.slice(0, 5);

      container.innerHTML = topGenres.map((g, index) => `
        <div class="rank-card ${index < 3 ? 'top-1' : ''}">
          <div class="rank-fill-bar" style="width: ${g.approvalPercentage}%"></div>
          <div class="rank-content">
            <div class="rank-badge">${index < 3 ? '#' + (index + 1) : ''}</div>
            <div style="font-size: 2.2rem; min-width: 50px; text-align: center;">${g.icon}</div>
            <div class="track-details">
              <div class="title-text">${g.name}</div>
              <div class="artist-text">${g.votesCount} votos registrados ${index < 3 ? '⭐ TOP 3 LÍDER' : ''}</div>
            </div>
            <div class="percentage-text">${g.approvalPercentage}%</div>
          </div>
        </div>
      `).join('');
    }

    async function updateScreen() {
      try {
        const res = await fetch(`/api/tanda/state?event=${encodeURIComponent(eventId)}`);
        const data = await res.json();
        
        if (data) {
          if (data.remainingSeconds !== undefined) {
            document.getElementById('timer-display').textContent = formatTime(data.remainingSeconds);
          }

          const headerTitle = document.getElementById('header-title-text');
          if (headerTitle) {
            headerTitle.textContent = data.mode === 'genres' ? 'ELEGÍ LOS 3 GÉNEROS DE LA TANDA' : 'LA BATALLA DEL PLAYLIST';
          }

          if (data.mode === 'genres' && data.genres) {
            renderGenresLeaderboard(data.genres);
          } else if (data.nominations) {
            renderLeaderboard(data.nominations);
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    updateScreen();
    setInterval(updateScreen, 2500);
  </script>
</body>
</html>
